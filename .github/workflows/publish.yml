name: "publish"
on: [workflow_dispatch]
jobs:
  publish:
    name: "publish"
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          cache: "gradle"
          distribution: "temurin"
          java-version: "17"
      - name: "Validate Gradle Wrapper"
        uses: gradle/actions/wrapper-validation@v4
      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@v4
      - name: "Publish"
        run: ./gradlew --no-daemon publishPlugins "-Pgradle.publish.key=${{ secrets.GRADLE_PUBLISH_KEY }}" "-Pgradle.publish.secret=${{ secrets.GRADLE_PUBLISH_SECRET }}"